[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nio-md-prep"
version = "1.0.0"
description = "Reproducible preparation of NiO/passivant LAMMPS systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dataset = ["numpy>=1.24", "ase>=3.23"]
analysis = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]
test = [
    "pytest>=7",
]

[project.scripts]
nio-md-prep = "nio_md_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
