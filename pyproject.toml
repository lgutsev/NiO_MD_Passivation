[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nio-md-prep"
version = "0.1.0"
description = "Reproducible preparation of NiO/passivant LAMMPS systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
analysis = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]
test = [
    "pytest>=7",
]
# The MLIP subsystem is entirely optional. Plain `pip install nio-md-prep`
# must not pull in PyTorch, CUDA, OpenMM or LAMMPS, so every backend lives
# behind an extra and every import of one is lazy. `mlip` is the smallest
# useful set: ASE as the interchange structure layer, plus numpy.
mlip = [
    "ase>=3.23",
    "numpy>=1.24",
]
# A trained MACE model, evaluated through MACE's own ASE calculator. Install
# the torch build that matches the target machine's CUDA separately; this
# extra deliberately does not pin one.
mace = [
    "nio-md-prep[mlip]",
    "mace-torch>=0.3.6",
    "torch>=2.1",
]
# MACE through OpenMM, via OpenMM-ML. Both are conda-forge packages in
# practice; listed here so the dependency is documented even where pip cannot
# satisfy it.
openmm = [
    "nio-md-prep[mace]",
    "openmm>=8.1",
    "openmm-ml>=1.2",
]

[project.scripts]
nio-md-prep = "nio_md_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Ordinary CI runs everything unmarked: configuration parsing, bridge
# resolution, unit conversions, provenance, capability failures and the mock
# potential. The marked tests need a backend, a GPU, or a trained model
# supplied through NIO_MD_TEST_MACE_MODEL, and are skipped otherwise.
markers = [
    "mace: needs mace-torch and a model from $NIO_MD_TEST_MACE_MODEL",
    "lammps: needs a LAMMPS build with the relevant pair-style package",
    "openmm: needs openmm and openmm-ml",
    "gpu: needs a CUDA device",
]
