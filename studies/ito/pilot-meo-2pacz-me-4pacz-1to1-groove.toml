# Corrugated counterpart of pilot-meo-2pacz-me-4pacz-1to1.toml: same molecules and protocol on in2o3-111-oh-groove,
# the ITO analogue of the corrugated NiO(110) slab (14.6 A deep 45-degree V-groove along x).
# Dose matched to the NiO baseline: 3.45 nm^-2 x 53.18 nm2 -> 184 molecules.
[study]
name = "ITO pilot: MeO-2PACz + Me-4PACz (1:1 molar) on corrugated In2O3(111)-OH"
protocol = "ito-pilot-deposition"

[substrate]
path = "inputs/ito/surfaces/in2o3-111-oh-groove"

[forcefield]
surface_parameter_set = "uff-cation/clayff-anion"

[box]
# Lowered from the slab file default (200 A) to shrink the PPPM grid.
zhi = 125.0

[packing]
gap = 8.0
height = 50.0
lateral_inset = 1.0

[random]
packmol_seed = 11
velocity_seed = 101

[protocol]
temperature = 300.0
timestep = 1.0
shake = true
deposition_steps = 300000
hold_steps = 200000
release_steps = 100000
relax_steps = 300000
wall_clearance = 30.0
release_height = 40.0
dump_every = 5000

[[molecules]]
slug = "me-4pacz"
count = 92

[[molecules]]
slug = "meo-2pacz"
count = 92
