# Hydroxylation-series pilot: meo-2pacz-me-4pacz-1to1 on corrugated In2O3(111) (ITO proxy), hydroxylation 75 % of exposed cations.
# Surface: inputs/ito/surfaces/in2o3-111-groove-oh075. Dose matched to the NiO campaign (184 molecules).
# ITO saturates at 64 % of exposed In; the 100 % request is the same surface as 75 %.
[study]
name = "Hydroxylation pilot: MeO-2PACz + Me-4PACz (1:1 molar) on ito-groove 75 % OH"
protocol = "ito-pilot-deposition"

[substrate]
path = "inputs/ito/surfaces/in2o3-111-groove-oh075"

[forcefield]
surface_parameter_set = "uff-cation/clayff-anion"

[box]
# Lowered from the slab file default (200 A) to shrink the PPPM grid.
zhi = 125.0

[packing]
gap = 8.0
height = 50.0
lateral_inset = 1.0

[random]
packmol_seed = 11
velocity_seed = 101

[protocol]
temperature = 300.0
timestep = 1.0
shake = true
deposition_steps = 300000
hold_steps = 200000
release_steps = 100000
relax_steps = 300000
wall_clearance = 30.0
release_height = 40.0
dump_every = 5000

[[molecules]]
slug = "me-4pacz"
count = 92

[[molecules]]
slug = "meo-2pacz"
count = 92
