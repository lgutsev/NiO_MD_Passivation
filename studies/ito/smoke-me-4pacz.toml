# PIPELINE SMOKE ONLY (70 ps total): exercises build -> MD -> analysis for pilot 1. Not a result.
# Areal dose matched to the NiO baseline (180 molecules / 52.17 nm2 = 3.45 nm^-2)
# on the 28.37 nm2 slab -> 98 molecules.  Not a production study.
[study]
name = "ITO smoke: Me-4PACz on In2O3(111)-OH (short protocol)"
protocol = "ito-pilot-deposition"

[substrate]
path = "inputs/ito/surfaces/in2o3-111-oh"

[forcefield]
surface_parameter_set = "uff-cation/clayff-anion"

[box]
# Lowered from the slab file default (200 A) to shrink the PPPM grid.
zhi = 125.0

[packing]
gap = 8.0
height = 50.0
lateral_inset = 1.0

[random]
packmol_seed = 11
velocity_seed = 101

[protocol]
temperature = 300.0
timestep = 1.0
shake = true
deposition_steps = 30000
hold_steps = 10000
release_steps = 10000
relax_steps = 20000
wall_clearance = 30.0
release_height = 40.0
dump_every = 1000

[[molecules]]
slug = "me-4pacz"
count = 98
