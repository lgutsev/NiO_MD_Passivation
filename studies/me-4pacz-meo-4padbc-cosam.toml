[study]
name = "Me-4PACz + MeO-4PADBC CoSAM"
protocol = "cosam"
[protocol]
deposition_steps = 600000
deposition_timestep = 0.5
wall_clearance = 30.0
deposition_lower_wall = "EDGE"
production_lower_wall_300 = "EDGE"
production_lower_wall_400 = "EDGE"
production_upper_wall_mode = "auto"
production_upper_wall_min = 120.0
production_wall_clearance = 30.0
production_wall_rounding = 10.0
production_box_margin = 5.0
[[molecules]]
slug = "me-4pacz"
count = 180
[[molecules]]
slug = "meo-4padbc"
count = 77

[composition]
basis = "equal_stock_volume"
stock_volume_assumption = "equal primary and secondary stock volumes"
rounding_rule = "nearest integer, half away from zero"
stock_concentration_mg_ml = { primary = 0.5, secondary = 0.3 }
